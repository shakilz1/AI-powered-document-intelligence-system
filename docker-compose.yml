# Production-like stack: PostgreSQL + API (+ built frontend served by nginx).
# NOTE: written for convenience but NOT tested here (Docker was not available on the dev machine).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: http://localhost:8080
    volumes: [uploads:/data]
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

  web:
    image: node:22-alpine
    working_dir: /web
    volumes: ["./frontend:/web"]
    command: sh -c "npm ci && npm run build && npx vite preview --host 0.0.0.0 --port 8080"
    environment:
      VITE_API_BASE: http://localhost:8000
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
